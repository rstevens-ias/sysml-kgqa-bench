[project]
name = "sysml-kgqa-bench"
version = "1.0.0"
description = "Closed-world KGQA benchmark over the TMT SysML model, with per-class correctness guarantees."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "kuzu>=0.11.3",
    "lxml>=6.1.1",
    "networkx>=3.6.1",
    # pcst-fast is compiled against the numpy 1.x C-API and returns wrong results under numpy 2.x.
    "numpy==1.26.4",
    "scipy==1.13.1",
    "openai>=2.46.0",
    "pandas>=2.0",
    "pcst-fast>=1.0.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=3.0",
    "tenacity>=8.2",
    "torch-geometric>=2.6",
]

[project.optional-dependencies]
cpu = ["torch>=2.8"]
cu128 = ["torch>=2.8"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysml_kgqa_bench"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu128" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
